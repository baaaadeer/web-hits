<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draggable Blocks</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
</head>
<body>
    <div class="back-block">
        <div class = "Work-Block" id = "Work-Area">
            <button id="runButton">Run</button>
        </div>

        <div class = "Blocks-Area" id="menu">
            Blocks
            <div class="block" data-type="variable">Создать переменную</div>
            <div class="block" data-type="operation">Арифметическая операция</div>
            <div class="block" data-type="operatorIf">If</div>
            <div class="block" data-type="operatorElse">Else</div>
        </div>

        <div class="Output-Area" id="output">Output</div>
    </div>

    <script type="module" src="scripts/block.js"></script>
</body>
</html>
